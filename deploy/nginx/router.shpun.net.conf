# Public gateway for Shpun Router devices.
# External API:
#   GET /connect -> router registration/status lookup
#   GET /profile -> subscription/profile refresh
#
# Obtain the certificate before enabling the TLS server block:
#   certbot certonly --webroot -w /var/www/html -d router.shpun.net

server {
    listen 80;
    listen [::]:80;
    server_name router.shpun.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name router.shpun.net;

    ssl_certificate     /etc/letsencrypt/live/router.shpun.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/router.shpun.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/router_shpun.access.log;
    error_log  /var/log/nginx/router_shpun.error.log warn;

    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $upstream_host "bill.shpyn.online";

    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    proxy_ssl_server_name on;
    proxy_ssl_name $upstream_host;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;

    location = /connect {
        limit_except GET {
            deny all;
        }

        proxy_pass https://bill.shpyn.online/shm/v1/public/router_public;
    }

    location = /profile {
        limit_except GET {
            deny all;
        }

        proxy_pass https://bill.shpyn.online/shm/v1/public/router_config;
    }

    location / {
        return 404;
    }
}
