name: Build Xray binaries for all router architectures

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-xray.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: mips_24kc
            goarch: mips
            gomips: softfloat
          - arch: mipsel_24kc
            goarch: mipsle
            gomips: softfloat
          - arch: armv7
            goarch: arm
            goarm: 7
          - arch: aarch64
            goarch: arm64
          - arch: amd64
            goarch: amd64

    steps:
      - name: Checkout Xray source
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: v1.8.24   # <-- можно обновлять вручную

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Xray
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          mkdir -p build/${{ matrix.arch }}
          go build -o build/${{ matrix.arch }}/xray ./main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/xray
