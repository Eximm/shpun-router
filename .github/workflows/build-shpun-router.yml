name: Build shpun-router OpenWrt 24 package

on:
  push:
    branches: [ shpun-router ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SDK_URL: https://downloads.openwrt.org/releases/24.10.3/targets/ath79/generic/openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64
      PACKAGE_NAME: shpun-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check LuCI and subscription notice behavior
        run: |
          node deploy/test-server-modal.cjs
          node deploy/test-subscription-notice.cjs
          if test -f deploy/test-network-modal.cjs; then node deploy/test-network-modal.cjs; fi
      - name: Check every packaged shell script
        run: |
          set -eu
          find package/shpun-router/files deploy -type f -print0 | while IFS= read -r -d '' file; do
            if head -1 "$file" | grep -q '^#!/bin/sh'; then sh -n "$file"; fi
          done
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk unzip file libssl-dev wget python3 zstd
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: linux-ubuntu24-openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64-v2
      - name: Download and verify SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -eu
          wget -q -O "$SDK_DIR.tar.zst" "$SDK_URL"
          wget -q -O sdk-sha256sums "${SDK_URL%/*}/sha256sums"
          awk -v name="$SDK_DIR.tar.zst" '$2==name || $2=="*"name' sdk-sha256sums > sdk-check.sha256
          test -s sdk-check.sha256
          sha256sum -c sdk-check.sha256
          tar -I zstd -xf "$SDK_DIR.tar.zst"
          mv "$SDK_DIR" sdk
      - name: Stage reviewed script-only package
        run: |
          set -eu
          test -d sdk/staging_dir
          rm -rf "sdk/package/$PACKAGE_NAME"
          cp -a "package/$PACKAGE_NAME" "sdk/package/$PACKAGE_NAME"
          find "sdk/package/$PACKAGE_NAME" -type f -exec sed -i 's/\r$//' {} \;
          printf '%s\n' '# CONFIG_ALL is not set' '# CONFIG_ALL_KMODS is not set' '# CONFIG_ALL_NONSHARED is not set' 'CONFIG_PACKAGE_shpun-router=m' > sdk/.config
      - name: Build package
        working-directory: sdk
        run: |
          set -eu
          make defconfig
          make package/${PACKAGE_NAME}/clean V=s
          mkdir -p bin
          rm -rf bin/ota
          find bin -type f -name '*shpun-router*.ipk' -delete
          make package/${PACKAGE_NAME}/compile -j2 V=s NO_DEPS=1
      - name: Prepare OTA artifact with checksum and source identity
        working-directory: sdk
        run: |
          set -eu
          version=$(sed -n 's/^PKG_VERSION:=[[:space:]]*//p' package/${PACKAGE_NAME}/Makefile)
          release=$(sed -n 's/^PKG_RELEASE:=[[:space:]]*//p' package/${PACKAGE_NAME}/Makefile)
          built=$(find bin -type f -name '*shpun-router*.ipk' ! -path 'bin/ota/*' -print -quit)
          test -n "$built"
          mkdir -p bin/ota
          cp "$built" "bin/ota/${PACKAGE_NAME}_${version}_all.ipk"
          cd bin/ota
          sha256sum "${PACKAGE_NAME}_${version}_all.ipk" > SHA256SUMS
          printf '{"commit":"%s","version":"%s","release":"%s","openwrt":"24"}\n' "$GITHUB_SHA" "$version" "$release" > source.json
      - uses: actions/upload-artifact@v4
        with:
          name: shpun-router-ota
          path: sdk/bin/ota/
          if-no-files-found: error
