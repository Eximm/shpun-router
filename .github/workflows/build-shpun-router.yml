name: Build shpun-router OpenWrt package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_URL: https://downloads.openwrt.org/releases/24.10.3/targets/ath79/generic/openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64
      PACKAGE_NAME: shpun-router

    steps:
      # --- Checkout ---
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- Deps ---
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev gawk unzip file \
            libssl-dev wget python3 zstd

      # --- SDK cache ---
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: linux-openwrt-sdk-24.10.3-ath79-v1

      # --- Download SDK if not cached ---
      - name: Download & unpack OpenWrt SDK (on cache miss)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          echo "SDK cache miss — downloading"
          wget -O sdk.tar.zst "$SDK_URL"
          tar -I zstd -xf sdk.tar.zst
          mv "$SDK_DIR" sdk
          ls -la sdk

      # --- Initial config (only on cache miss) ---
      - name: Configure SDK (only once)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          make defconfig

      # Debug cache
      - name: Debug cache hit
        run: echo "SDK cache hit = ${{ steps.cache-sdk.outputs.cache-hit }}"

      # Info
      - name: SDK info
        working-directory: sdk
        run: |
          pwd
          ls -la

      # --- Copy package to SDK ---
      - name: Copy package into SDK
        run: |
          mkdir -p sdk/package
          rm -rf sdk/package/${PACKAGE_NAME}
          cp -r package/${PACKAGE_NAME} sdk/package/
          ls -la sdk/package/${PACKAGE_NAME}

      # --- Clean package before build ---
      - name: Clean package
        working-directory: sdk
        run: |
          make package/${PACKAGE_NAME}/clean V=s || true

      # --- Build ---
      - name: Build package
        working-directory: sdk
        run: |
          make package/${PACKAGE_NAME}/compile -j"$(nproc)" V=s

      # --- List compiled IPKs ---
      - name: List built packages
        working-directory: sdk
        run: |
          find bin -name "*${PACKAGE_NAME}*.ipk" -print || echo "No ipk found"

      # --- Create clean OTA filename ---
      - name: Create clean OTA filename
        id: ota
        working-directory: sdk
        run: |
          set -e

          PKG_VERSION=$(sed -n 's/^PKG_VERSION:=\s*//p' package/${PACKAGE_NAME}/Makefile)
          echo "Detected PKG_VERSION=$PKG_VERSION"

          ORIG_IPK=$(find bin -name "${PACKAGE_NAME}_*.ipk" | head -n1)

          if [ -z "$ORIG_IPK" ]; then
            echo "ERROR: No shpun-router ipk found" >&2
            exit 1
          fi

          echo "Original ipk: $ORIG_IPK"

          rm -rf bin/ota
          mkdir -p bin/ota
          CLEAN_IPK="bin/ota/${PACKAGE_NAME}_${PKG_VERSION}_all.ipk"

          mv "$ORIG_IPK" "$CLEAN_IPK"
          ls -lh "$CLEAN_IPK"
          echo "clean_ipk=sdk/$CLEAN_IPK" >> "$GITHUB_OUTPUT"

      # --- Upload OTA artifact ---
      - name: Upload shpun-router OTA package
        uses: actions/upload-artifact@v4
        with:
          name: shpun-router-ota
          path: ${{ steps.ota.outputs.clean_ipk }}
