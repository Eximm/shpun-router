name: Build shpun-router OpenWrt package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # SDK для OpenWrt 24.10.3, target ath79/generic
      SDK_URL: https://downloads.openwrt.org/releases/24.10.3/targets/ath79/generic/openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
      SDK_DIR: openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64
      PACKAGE_NAME: shpun-router

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev gawk unzip file \
            libssl-dev wget python3 zstd

      # 🧊 Кэшируем уже распакованный и сконфигурированный SDK
      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk
          # Если меняешь версию SDK_URL/SDK_DIR или feeds — поменяй v1 → v2
          key: ${{ runner.os }}-openwrt-sdk-${{ env.SDK_DIR }}-v1

      - name: Download & unpack OpenWrt SDK (on cache miss)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          echo "SDK cache miss, downloading..."
          wget -O sdk.tar.zst "$SDK_URL"
          tar -I zstd -xf sdk.tar.zst
          mv "$SDK_DIR" sdk
          ls -la sdk

      - name: Configure SDK (feeds + defconfig, only once)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: SDK info
        working-directory: sdk
        run: |
          pwd
          ls -la
          ls -la package || true

      - name: Copy package into SDK
        run: |
          mkdir -p sdk/package
          # На всякий случай удаляем старую копию пакета
          rm -rf sdk/package/${PACKAGE_NAME}
          cp -r package/${PACKAGE_NAME} sdk/package/
          ls -la sdk/package/${PACKAGE_NAME}

      # 🧩 Автоматически обновляем номер релиза перед сборкой
      - name: Patch PKG_RELEASE with GitHub run number
        run: |
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" sdk/package/${PACKAGE_NAME}/Makefile
          echo "Patched PKG_RELEASE=${GITHUB_RUN_NUMBER}"
          grep PKG_RELEASE sdk/package/${PACKAGE_NAME}/Makefile || true

      # 🧹 Локально чистим только наш пакет (по желанию можно убрать)
      - name: Clean package before build
        working-directory: sdk
        run: |
          make package/${PACKAGE_NAME}/clean V=s

      - name: Build package
        working-directory: sdk
        run: |
          # Используем все доступные ядра раннера
          make package/${PACKAGE_NAME}/compile -j"$(nproc)" V=s

      - name: List built packages
        working-directory: sdk
        run: |
          find bin -name "*${PACKAGE_NAME}*.ipk" -print || echo "No ipk found"

      - name: Upload shpun-router ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: shpun-router-ipk
          path: |
            sdk/bin/packages/**/*shpun-router*.ipk
            sdk/bin/targets/**/*shpun-router*.ipk
