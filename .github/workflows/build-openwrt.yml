name: Build shpun-router OpenWrt package

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # SDK для OpenWrt 24.10.3, target ath79/generic
      SDK_URL: https://downloads.openwrt.org/releases/24.10.3/targets/ath79/generic/openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.xz
      SDK_DIR: openwrt-sdk-24.10.3-ath79-generic_gcc-13.3.0_musl.Linux-x86_64

      PACKAGE_NAME: shpun-router

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev gawk unzip file \
            libssl-dev wget python3

      - name: Download OpenWrt SDK
        run: |
          wget -O sdk.tar.xz "$SDK_URL"
          tar -xf sdk.tar.xz
          mv "$SDK_DIR" sdk
          ls -la
          ls -la sdk

      - name: Copy package into SDK
        run: |
          mkdir -p sdk/package
          cp -r package/${PACKAGE_NAME} sdk/package/
          ls -la sdk/package
          ls -la sdk/package/${PACKAGE_NAME}

      - name: Configure SDK
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build package
        working-directory: sdk
        run: |
          make package/${PACKAGE_NAME}/compile V=s

      - name: List built packages
        working-directory: sdk
        run: |
          find bin -name "*${PACKAGE_NAME}*.ipk" -print || echo "No ipk found"

      - name: Upload shpun-router ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: shpun-router-ipk
          path: |
            sdk/bin/packages/**/*shpun-router*.ipk
