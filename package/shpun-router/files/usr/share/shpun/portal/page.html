<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Shpun Router — подписка</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;color:#f5f6ff;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 8%,#26255380,transparent 45%),radial-gradient(ellipse at 90% 85%,#12395170,transparent 45%),#090f1d}.wrap{width:min(100%,560px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;font-weight:760;letter-spacing:.2px}.logo{width:42px;height:46px;display:grid;place-items:center;background:linear-gradient(140deg,#9a5fff,#4746e9);clip-path:polygon(50% 0,95% 20%,89% 70%,50% 100%,11% 70%,5% 20%);font-size:27px;font-weight:900;filter:drop-shadow(0 0 16px #6255d9)}.brand small{display:block;color:#929db8;font-size:12px;font-weight:500;letter-spacing:1.7px;text-transform:uppercase}.card{position:relative;overflow:hidden;padding:38px;border:1px solid #ffffff16;border-radius:28px;background:linear-gradient(145deg,#17263fdd,#13172bdd);box-shadow:0 28px 90px #0005}.card:before{content:"";position:absolute;top:0;left:38px;right:38px;height:1px;background:linear-gradient(90deg,transparent,#8b78ff80,transparent)}.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #b6983b40;background:#7f62251c;border-radius:99px;color:#f0d178;font-size:12px;font-weight:650}.dot{width:6px;height:6px;border-radius:50%;background:#efcc60;box-shadow:0 0 9px #efcc6040}h1{font-size:clamp(28px,6.6vw,36px);line-height:1.18;letter-spacing:-1.1px;margin:25px 0 16px;font-weight:780}p{color:#b9c3d9;margin:0 0 26px;font-size:15px}.button{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;border:1px solid #b5a0ff38;border-radius:15px;padding:16px 18px;color:white;background:linear-gradient(110deg,#6044dd,#4c52cc);font:700 15px system-ui;cursor:pointer;box-shadow:0 8px 28px #4c3acb30;transition:filter .15s,transform .15s}.button:hover{filter:brightness(1.12)}.button:active{transform:translateY(1px)}.button:focus-visible{outline:3px solid #b9acff;outline-offset:4px}.note{margin-top:22px;padding-top:22px;border-top:1px solid #ffffff0b;display:flex;gap:12px;color:#a4b0c8;font-size:13px}.note svg{flex:none;color:#7f89bd;margin-top:3px}.footer{text-align:center;color:#66738e;font-size:12px;margin:22px 0}.footer span{color:#8490aa}@media(max-width:420px){.card{padding:29px 25px;border-radius:24px}.brand{margin-bottom:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="wrap"><div class="brand"><div class="logo" aria-hidden="true">S</div><div>Shpun Router<small>SDN System</small></div></div><section class="card"><div class="badge"><i class="dot"></i>@@BADGE@@</div><h1>@@TITLE@@</h1><p>Продлите услугу в ShpunApp.<br>Повторно привязывать роутер не нужно.</p><form method="post" action="@@ACTION@@"><input type="hidden" name="token" value="@@TOKEN@@"><button class="button" type="submit">Продлить в ShpunApp <span aria-hidden="true">↗</span></button></form><div class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3 21 7v5c0 5-9 9-9 9s-9-4-9-9V7l9-4Z"/><path d="m8 12 3 3 5-6"/></svg><div>После нажатия интернет будет работать напрямую, без VPN, чтобы вы могли оплатить услугу. После продления VPN включится автоматически.</div></div></section><div class="footer">Ваш роутер остаётся привязан к <span>ShpunApp</span></div></main></body></html>
