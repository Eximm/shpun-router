# Shpun Router / shpun-agent config
#
# Это основной конфиг для демона shpun-agent и build-config.sh.
# Здесь задаются:
#   - API биллинга для роутеров
#   - URL бинарника VPN-движка (sing-box)
#   - пути до бинарника и конфига
#   - интервалы проверки подписки
#   - DNS-серверы для sing-box (ТОЛЬКО для dial, не для LAN)
#   - MTU туннеля

########################################
# 1. Публичный API биллинга для роутеров
########################################

# Публичный API биллинга для роутеров (SHM public template).
# Агент по этому адресу проверяет привязку к услуге и получает subscription_url.
API_URL="https://bill.shpyn.online/shm/v1/public/router_public"


########################################
# 2. VPN-движок (sing-box)
########################################

# Откуда качаем VPN-движок (sing-box под mips_24kc)
ENGINE_URL="https://spb.shpyn.online/files/sing-box"

# Куда кладём бинарник движка
ENGINE_BIN="/tmp/sing-box"

# Куда сохраняем конфиг sing-box (используется build-config.sh)
ENGINE_CONFIG="/etc/shpun/sing-box.json"

# Необязательная проверка целостности бинарника (SHA-256).
# Если не хочешь проверять — просто закомментируй эту строку.
# ENGINE_SHA256="f426edd1abc65df746620f30c336a1b307224220c421f3d8eefedf8657f21168"


########################################
# 3. Проверка подписки
########################################

# Как часто проверять, что subscription_url ещё жива (в секундах).
# 6 часов = 21600
SUB_CHECK_INTERVAL=21600


########################################
# 4. DNS для sing-box (ТОЛЬКО для VPN)
########################################
#
# Эти DNS используются ТОЛЬКО внутри sing-box для резолва доменов
# (server / SNI и т.п.). LAN-клиенты продолжают пользоваться dnsmasq,
# который смотрит на DNS провайдера/роутера.
#
# По умолчанию два относительно независимых резолвера:
#   9.9.9.9  (Quad9)
#   8.8.8.8  (Google)
#
# Для РФ можно при желании задать, например:
#   DNS_ADDR1="77.88.8.8"    # Яндекс
#   DNS_ADDR2="77.88.8.1"
#
# Эти значения подхватываются в build-config.sh при генерации sing-box.json.

DNS_ADDR1="9.9.9.9"
DNS_ADDR2="8.8.8.8"


########################################
# 5. Настройки туннеля
########################################
#
# MTU для интерфейса tun0 внутри sing-box.
# Реально рабочий диапазон обычно 1400–1500.
# Значение используется в build-config.sh при создании inbounds.tun.mtu.

TUN_MTU=1450
