# Конфиг для shpun-agent

# Какой движок используем (для логов)
ENGINE_NAME="sing-box"

# Путь к бинарнику движка на роутере
ENGINE_BIN="/tmp/sing-box"

# Путь к конфигу движка
ENGINE_CONFIG="/etc/shpun/sing-box.json"

# URL статического бинаря (под mips_24kc + musl)
# TODO: заменить, когда будет готов рабочий sing-box
ENGINE_URL="https://spb.shpyn.online/files/sing-box"

# SHA256 этого бинарника (64 hex)
# TODO: вписать реальный хэш после заливки sing-box на сервер
ENGINE_SHA256="29723fe3fd9e3a166aa8c407ad4ffc8ff20ae21aa629e15a423433fef382acd5"

# init-скрипт VPN-сервиса (ниже мы его создадим)
ENGINE_SERVICE_INIT="/etc/init.d/shpun-vpn"

# Таймауты скачивания (секунды)
DOWNLOAD_CONNECT_TIMEOUT=10
DOWNLOAD_READ_TIMEOUT=60

# Файл логов агента (опционально)
AGENT_LOG="/var/log/shpun-agent.log"
