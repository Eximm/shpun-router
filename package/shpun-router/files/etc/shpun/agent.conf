# Shpun Router / shpun-agent config (Xray + Shadowsocks edition)
#
# Основной конфиг для демона shpun-agent и build-config.sh.
# Здесь задаются:
#   - Публичный API биллинга для роутеров
#   - Базовый URL для Xray-бинарей (под разные архитектуры)
#   - Локальные пути до бинаря и конфига Xray
#   - Интервалы проверки подписки
#   - Failsafe-параметры (аптайм, проверка интернета)
#   - Порт прозрачного докодемо (REDIR_PORT) для iptables REDIRECT
#   - (опционально) DNS-серверы для Xray
#   - (резерв) настройки туннеля на будущее

########################################
# 1. Публичный API биллинга для роутеров
########################################

# Публичный API биллинга для роутеров (SHM public template).
# Агент по этому адресу проверяет привязку к услуге и получает config_url
# (router_config), откуда уже берётся subscription.json.
API_URL="https://bill.shpyn.online/shm/v1/public/router_public"


########################################
# 2. VPN-движок (Xray)
########################################
#
# В качестве движка используется Xray, который shpun-agent скачивает
# во временный RAM-диск /tmp.
#
# Для мультиарх-схемы:
#   ENGINE_BASE_URL + auto-detect в agent.sh ->
#   https://spb.shpyn.online/files/xray/xray-<arch>[-<version>]
#
# Примеры имён бинарей на сервере:
#   xray-mips_24kc
#   xray-mipsel_24kc
#   xray-armv7
#   xray-aarch64
#   xray-amd64

# Базовый URL для Xray-бинарей
ENGINE_BASE_URL="https://spb.shpyn.online/files/xray"

# Локальный путь к бинарю (скачивается в RAM, не во флеш)
ENGINE_BIN="/tmp/xray"

# Путь к основному конфигу Xray (генерируется build-config.sh)
ENGINE_CONFIG="/etc/shpun/xray.json"

# Необязательная проверка целостности бинарника (SHA-256).
# Если не хочешь проверять — оставь закомментированным.
# ENGINE_SHA256="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Необязательная фиксация версии/суффикса (можно использовать в agent.sh при формировании имени файла).
# Если пусто — используется вид:
#   xray-<arch>
ENGINE_VERSION=""


########################################
# 3. Проверка подписки
########################################

# Как часто проверять, что подписка ещё жива через router_config (в секундах).
# 6 часов = 21600
SUB_CHECK_INTERVAL=21600


########################################
# 4. DNS для Xray (ОПЦИОНАЛЬНО, ДЛЯ БУДУЩЕГО)
########################################
#
# Эти DNS при желании можно использовать внутри Xray для резолва доменов
# (server / SNI и т.п.). LAN-клиенты по-прежнему пользуются dnsmasq.
# Сейчас build-config.sh может их игнорировать — оставляем как задел.

DNS_ADDR1="9.9.9.9"
DNS_ADDR2="8.8.8.8"


########################################
# 5. Failsafe и прозрачный режим (Xray + dokodemo-door)
########################################
#
# В Xray-режиме с прозрачным прокси (dokodemo-door + REDIRECT) tun-интерфейс
# не используется. Вместо этого firewall перенаправляет трафик на REDIR_PORT.

# 5.1. Failsafe / защита от вечных ребутов интернета

# Не трогать VPN, пока роутер не проработал как минимум MIN_UPTIME секунд.
MIN_UPTIME=120

# Если при активном VPN нет интернета NET_FAIL_TIMEOUT секунд —
# агент остановит shpun-vpn и сбросит vpn_ready.
NET_FAIL_TIMEOUT=60

# Пауза основного цикла агента (в секундах).
MAIN_LOOP_SLEEP=30

# 5.2. Порт прозрачного докодемо для Xray
#
# Должен совпадать:
#   - с REDIR_PORT в /etc/shpun/build-config.sh
#   - с портом, на который ты делаешь iptables/nftables REDIRECT.
REDIR_PORT=12345

# 5.3. Хост для ping-проверки интернета
#
# Если PING_HOST не задан, агент возьмёт DNS_ADDR1, а если и он пустой —
# будет использовать 8.8.8.8.
# Можно переопределить, если хочется пинговать что-то своё (например 1.1.1.1).
# PING_HOST="1.1.1.1"


########################################
# 6. Настройки туннеля (РЕЗЕРВ НА БУДУЩЕЕ)
########################################
#
# Если в будущем захотим вернуться к tun-inbound в Xray (вместо dokodemo-door),
# TUN_MTU можно будет использовать в build-config.sh для настройки MTU.
# Сейчас он игнорируется.

TUN_MTU=1450

########################################
# 7. Keepalive VPN (поддержание туннеля)
########################################
# Как часто посылать маленький запрос через туннель
# для поддержания сессии на стороне SS/Xray, в секундах.
# 0 = выключено.
KEEPALIVE_INTERVAL=600

# URL для проверки внешнего IP через туннель.
# Можно заменить на свой хост, если захочешь.
KEEPALIVE_URL="http://ifconfig.me/ip"
