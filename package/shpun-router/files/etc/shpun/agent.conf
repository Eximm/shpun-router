# Shpun Router / shpun-agent config

# Публичный API биллинга для роутеров
API_URL="https://bill.shpyn.online/shm/v1/public/router_public"

# Откуда качаем VPN-движок (sing-box под mips_24kc)
ENGINE_URL="https://spb.shpyn.online/files/sing-box"

# Куда кладём бинарник движка
ENGINE_BIN="/tmp/sing-box"

# Куда сохраняем конфиг sing-box
ENGINE_CONFIG="/etc/shpun/sing-box.json"

# Необязательная проверка целостности бинарника (SHA-256).
# Если не хочешь проверять — просто закомментируй эту строку.
# ENGINE_SHA256="f426edd1abc65df746620f30c336a1b307224220c421f3d8eefedf8657f21168"

# Как часто проверять, что subscription_url ещё жива (в секундах).
# 6 часов = 21600
SUB_CHECK_INTERVAL=21600

DNS_INBOUND_ENABLED=0

