# Shpun Router / shpun-agent config
#
# Основной конфиг для демона shpun-agent и build-config.sh.
# Здесь задаются:
#   - Публичный API биллинга для роутеров
#   - Базовый URL для Xray-бинарей (под разные архитектуры)
#   - Локальные пути до бинаря и конфига Xray
#   - Интервалы проверки подписки
#   - Failsafe-параметры (аптайм, проверка интернета)
#   - Порт прозрачного докодемо (REDIR_PORT) для nftables REDIRECT
#   - Порт и параметры TPROXY для UDP
#   - DNS для защищенных сервисов через Xray

########################################
# 1. Публичный API биллинга для роутеров
########################################

# Public router gateway. Internal billing paths stay behind the gateway.
API_URL="https://router.shpun.net/connect"
CONFIG_API_URL="https://router.shpun.net/profile"
SUBSCRIPTION_MIRROR_BASE_URL="https://mirepo.space"


########################################
# 2. VPN-движок (Xray)
########################################
#
# В качестве движка используется Xray, который shpun-agent скачивает
# во временный RAM-диск /tmp.
#
# Для мультиарх-схемы:
#   ENGINE_BASE_URL + auto-detect в agent.sh ->
#   https://spb.shpyn.online/files/xray/xray-<arch>[-<version>]
#
# Примеры имён бинарей на сервере:
#   xray-mips_24kc
#   xray-mipsel_24kc
#   xray-armv7
#   xray-aarch64
#   xray-amd64

# Базовый URL для Xray-бинарей
ENGINE_BASE_URL="https://spb.shpyn.online/files/xray"
ENGINE_BASE_URLS="https://spb.shpyn.online/files/xray https://router.shpun.net/files/xray"

# Локальный путь к бинарю (скачивается в RAM, не во флеш)
ENGINE_BIN="/tmp/xray"

# Путь к основному конфигу Xray (генерируется build-config.sh)
ENGINE_CONFIG="/etc/shpun/xray.json"

# Необязательная проверка целостности бинарника (SHA-256).
# Если не хочешь проверять — оставь закомментированным.
# ENGINE_SHA256="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Необязательная фиксация версии/суффикса (можно использовать в agent.sh при формировании имени файла).
# Если пусто — используется вид:
#   xray-<arch>
ENGINE_VERSION=""


########################################
# 3. Проверка подписки
########################################

# Как часто проверять, что подписка ещё жива через router_config (в секундах).
# 6 часов = 21600
SUB_CHECK_INTERVAL=21600
SUB_UNAVAILABLE_RESET_LIMIT=3
HTTP_USER_AGENT="ShpunRouter"


########################################
# 4. DNS защищенных сервисов через Xray
########################################
#
# LAN-клиенты продолжают пользоваться dnsmasq. Домены always_vpn
# разрешаются через VPN, не затрагивая DNS имени самого VPN-сервера.

DNS_ADDR1="9.9.9.9"
DNS_PROXY_PORT=1053

# Bootstrap DNS for cold start. If local dnsmasq/upstream DNS refuses to resolve
# router.shpun.net or spb.shpyn.online before Xray starts, the agent adds these
# resolvers to dnsmasq and wwan so it can bind, download Xray, and recover.
DNS_BOOTSTRAP_ENABLE=1
DNS_BOOTSTRAP_SERVERS="1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 9.9.9.9 208.67.222.222 208.67.220.220 77.88.8.8 77.88.8.1"
DNS_BOOTSTRAP_TEST_DOMAINS="router.shpun.net spb.shpyn.online"


########################################
# 5. Failsafe и прозрачный режим (Xray + dokodemo-door)
########################################
#
# В Xray-режиме с прозрачным прокси (dokodemo-door + REDIRECT) tun-интерфейс
# не используется. Вместо этого firewall перенаправляет трафик на REDIR_PORT.

# 5.1. Failsafe / защита от вечных ребутов интернета

# Не трогать VPN, пока роутер не проработал как минимум MIN_UPTIME секунд.
MIN_UPTIME=120

# Отказ проверки WAN не останавливает работающий VPN.
# NET_FAIL_TIMEOUT задаёт интервал повторной записи события в лог.
NET_FAIL_TIMEOUT=60

# Пауза основного цикла агента (в секундах).
MAIN_LOOP_SLEEP=30

# Отключить IPv6 на LAN, пока прозрачное проксирование IPv6 не поддерживается.
# Это не даёт телефонам и браузерам обходить IPv4 VPN через IPv6.
# 1 = отключить LAN IPv6 RA/DHCPv6/NDP и ip6assign, 0 = не менять настройки IPv6.
DISABLE_LAN_IPV6=1

# 5.2. Порт прозрачного докодемо для TCP (Xray)
#
# Должен совпадать:
#   - с REDIR_PORT в /etc/shpun/build-config.sh
#   - с портом, на который делается nftables REDIRECT (TCP).
REDIR_PORT=12345

# Локальный HTTP-вход Xray для проверки реального прохождения трафика через VPN.
HTTP_PROXY_PORT=10809
SOCKS_PROXY_PORT=10808

# 5.3. Хост для ping-проверки интернета
#
# Если PING_HOST не задан, агент возьмёт DNS_ADDR1, а если и он пустой —
# будет использовать 8.8.8.8.
# Можно переопределить, если хочется пинговать что-то своё (например 1.1.1.1).
# PING_HOST="1.1.1.1"

# Перезапуск туннеля допускается только после повторных неудачных проверок
# через несколько независимых HTTP-адресов внутри VPN.
TUNNEL_PROBE_URL="http://api.ipify.org"
TUNNEL_EXIT_PROBE_URLS="http://api.ipify.org http://ifconfig.me/ip http://icanhazip.com"
TUNNEL_PROBE_FALLBACK_URL="http://cp.cloudflare.com/generate_204"
TUNNEL_PROBE_SECONDARY_URL="http://connectivitycheck.gstatic.com/generate_204"


########################################
# 6. TPROXY — UDP через туннель
########################################
#
# Для полноценного VPN (звонки Telegram, QUIC, прокси-расширения Chrome и т.д.)
# UDP трафик перехватывается через механизм TPROXY ядра Linux.
#
# Требования к роутеру:
#   - модуль kmod-nft-tproxy
#   - nftables с поддержкой tproxy
#
# Если ядро не поддерживает TPROXY — firewall-xray.sh автоматически
# перейдёт в TCP-only режим; звонки и другой UDP-трафик через VPN работать не смогут.

# Порт dokodemo-door для UDP (tproxy inbound в xray.json).
# Не должен совпадать с REDIR_PORT.
TPROXY_PORT=12346

# Routing mark для пакетов, перехваченных через TPROXY.
# Используется в: nftables mangle + ip rule fwmark + ip route table.
# Не должен конфликтовать с другими fwmark в системе (OpenWrt по умолчанию не использует 233).
TPROXY_MARK=233

# Номер вспомогательной таблицы маршрутизации для TPROXY.
# Должен совпадать с TPROXY_MARK (по соглашению).
# Не должен конфликтовать с системными таблицами (main=254, default=253, local=255).
TPROXY_TABLE=233


########################################
# 7. Контроль работоспособности VPN
########################################
# Проверка реального выхода Xray без разрыва активных соединений.
# Восстановление запускается только после длительной непрерывной ошибки.
TUNNEL_PROBE_INTERVAL=60
TUNNEL_FAIL_TIMEOUT=180
ENGINE_DOWNLOAD_RETRY_INTERVAL=300
TUNNEL_PROBE_URL="http://api.ipify.org"


########################################
# 8. Защита режима split_ru
########################################

# Полный список российских маршрутов требует заметного объема памяти.
# На слабых устройствах режим блокируется для сохранения стабильности.
# SPLIT_RU_ALLOW_WEAK=1 предназначен только для ручной диагностики.
SPLIT_RU_MIN_MEM_KB=131072
SPLIT_RU_WARN_MEM_KB=196608
SPLIT_RU_ALLOW_WEAK=0
