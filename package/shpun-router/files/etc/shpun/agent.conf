# Конфиг для shpun-agent

# Какой движок используем (для логов)
ENGINE_NAME="sing-box"

# Путь к бинарнику движка на роутере (в RAM, чтобы не жрать флеш)
ENGINE_BIN="/tmp/sing-box"

# Путь к конфигу движка (маленький, можно во флеше)
ENGINE_CONFIG="/etc/shpun/sing-box.json"

# URL статического бинаря (под твою архитектуру OpenWrt)
ENGINE_URL="https://spb.shpyn.online/files/sing-box"

# SHA256 этого бинарника (sha256sum /var/www/files/sing-box)
ENGINE_SHA256="F426EDD1ABC65DF746620F30C336A1B307224220C421F3D8EEFEDF8657F21168"

# init-скрипт VPN-сервиса
ENGINE_SERVICE_INIT="/etc/init.d/shpun-vpn"

# Таймауты скачивания (секунды) — пока не используем, но зарезервированы
DOWNLOAD_CONNECT_TIMEOUT=10
DOWNLOAD_READ_TIMEOUT=60

# Файл логов агента (опционально).
# По умолчанию лучше оставить закомментированным, чтобы не забивать RAM.
# Раскомментируй, если нужно дебажить.
# AGENT_LOG="/var/log/shpun-agent.log"
